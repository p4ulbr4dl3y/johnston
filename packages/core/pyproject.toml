[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "johnston-core"
version = "0.30.0"
description = "Core SDK and agent engine for Johnston"
readme = "README.md"
license = "MIT"
authors = [
    { name = "p4ulbr4dl3y" },
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "httpx>=0.25.0,<1",
    "rich>=13.0.0,<16",
    "pygments>=2.18.0,<3",
    "markdown-it-py>=3.0.0,<5",
    "pillow>=12.3.0,<13",
    "tomli>=2.0,<3; python_version < '3.11'",
    "pypdf>=5.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "mermaid-ascii>=1.2.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "core",
    "tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "johnston-cli"
version = "0.30.0"
description = "Command-line interface and interactive agent for Johnston"
readme = "README.md"
license = "MIT"
authors = [
    { name = "p4ulbr4dl3y" },
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "johnston-core",
    "prompt-toolkit>=3.0.38",
]

[project.scripts]
j = "johnston_cli.entrypoint:main_j"
jc = "johnston_cli.entrypoint:main_j"
johnston = "johnston_cli.entrypoint:main_johnston"

[tool.uv.sources]
johnston-core = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = [
    "johnston_cli",
]

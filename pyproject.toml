[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tui-chat"
version = "0.1.0"
description = "Textual AI TUI Chat Application"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "markdown-it-py",
    "linkify-it-py",
    "mdit-py-plugins",
]

[project.scripts]
tui = "app:main"
tui-chat = "app:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

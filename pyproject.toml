[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "johnston"
version = "0.2.0"
description = "Textual AI Johnston Application"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "rich",
    "pygments",
    "markdown-it-py",
    "pillow>=12.3.0",
    "markitdown>=0.1.0",
]

[project.scripts]
johnston = "app:main"

[tool.hatch.build]
exclude = [
    ".github",
    ".johnston",
    ".ruff_cache",
    ".serena",
    "AGENTS.md",
    "dist",
    "install.ps1",
    "install.sh",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "app.tcss",
    "core",
    "tools",
    "widgets",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.deptry.package_module_name_map]
"markdown-it-py" = ["markdown_it"]
pillow = ["PIL"]

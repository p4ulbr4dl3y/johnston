[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "coverage>=7.0.0,<8",
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: timing-sensitive UI/latency tests, run serially via -m slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"packages/tui/app.py" = ["E402"]
"packages/tui/widgets/app/app.py" = ["E402"]
"widgets/app/app.py" = ["E402"]
"scripts/preview_system_prompt.py" = ["E402"]

[tool.coverage.run]
source = [
    "packages/core/core",
    "packages/core/tools",
    "packages/tui/widgets",
    "packages/tui/app",
    "packages/tui/cli",
]
omit = ["*/__init__.py", "*/core/domain/defaults/skills/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff.lint.isort]
known-first-party = ["core", "tools", "widgets", "app", "cli"]

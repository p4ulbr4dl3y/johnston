[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "johnston"
version = "0.25.0"
description = "Textual AI Johnston Application"
requires-python = ">=3.10, <3.14"
dependencies = [
    "textual>=8.0.0,<9",
    "openai>=1.0.0,<3",
    "httpx>=0.25.0,<1",
    "rich>=13.0.0,<16",
    "pygments>=2.18.0,<3",
    "markdown-it-py>=3.0.0,<5",
    "pillow>=12.3.0",
    "markitdown>=0.1.0",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.scripts]
johnston = "cli:main"

[tool.hatch.build]
exclude = [
    ".github",
    ".johnston",
    ".ruff_cache",
    ".serena",
    "AGENTS.md",
    "dist",
    "install.ps1",
    "install.sh",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "app.tcss",
    "cli.py",
    "core",
    "tools",
    "widgets",
]

[dependency-groups]
dev = [
    "coverage>=7.0.0,<8",
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: timing-sensitive UI/latency tests, run serially via -m slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.coverage.run]
source = ["app", "cli", "core", "tools", "widgets"]
omit = ["*/__init__.py", "core/domain/defaults/skills/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
